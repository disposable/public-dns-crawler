# Manual DoT (DNS-over-TLS) endpoint seeds.
# Each [[endpoints]] entry must have at minimum a `host` field.
# Example:
# [[endpoints]]
# host = "dns.example.com"
# port = 853
# provider = "Example"
# tls_server_name = "dns.example.com"   # defaults to host when it is a hostname
# bootstrap_ipv4 = ["1.2.3.4"]

[[endpoints]]
host = "dns.adguard-dns.com"
port = 853
provider = "AdGuard DNS"

[[endpoints]]
host = "dns.mullvad.net"
port = 853
provider = "Mullvad DNS"

[[endpoints]]
host = "one.one.one.one"
port = 853
provider = "Cloudflare"

[[endpoints]]
host = "1.1.1.1"
port = 853
provider = "Cloudflare"
tls_server_name = "one.one.one.one"

[[endpoints]]
host = "1.0.0.1"
port = 853
provider = "Cloudflare"
tls_server_name = "one.one.one.one"

[[endpoints]]
host = "dns.quad9.net"
port = 853
provider = "Quad9"

[[endpoints]]
host = "9.9.9.9"
port = 853
provider = "Quad9"
tls_server_name = "dns.quad9.net"

[[endpoints]]
host = "149.112.112.112"
port = 853
provider = "Quad9"
tls_server_name = "dns.quad9.net"

[[endpoints]]
host = "dns.nextdns.io"
port = 853
provider = "NextDNS"

[[endpoints]]
host = "dns0.eu"
port = 853
provider = "dns0.eu"
